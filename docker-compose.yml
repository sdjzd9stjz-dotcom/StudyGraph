services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: studygraph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: studygraph
      POSTGRES_PASSWORD: studygraph
      POSTGRES_DB: studygraph
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studygraph -d studygraph"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: studygraph-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3 兼容存储。
  #
  # 为什么不是 MinIO（2026-11-19 实测）：
  #   - Docker Hub 上 minio/minio 已不存在（MinIO 迁到 quay.io，而本机代理链路上
  #     quay 的 token 认证握手拿不到 200，HEAD manifest 恒为 401）
  #   - dl.min.io 的 windows 二进制路径已 410 下架
  # SeaweedFS 的 S3 网关实现的是同一套 S3 协议，我们的 ObjectStore 层只依赖协议，
  # 换回 MinIO 只需改 image 与端口，代码不用动。
  s3:
    image: chrislusf/seaweedfs:latest
    container_name: studygraph-s3
    restart: unless-stopped
    command: server -s3 -s3.port=8333 -dir=/data -master.volumeSizeLimitMB=1024
    ports:
      - "9000:8333" # 对外仍是 9000，.env 的 S3_ENDPOINT 不用改
      - "9333:9333" # master
    volumes:
      - s3data:/data
    # 不设 healthcheck：SeaweedFS 镜像里没有 wget/curl，任何探针都是假红。
    # 就绪性由 scripts 里的 S3 往返校验（put → get → sha256 比对 → delete）证明，比探针更强。

volumes:
  pgdata:
  redisdata:
  s3data:
